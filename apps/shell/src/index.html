<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rose</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="logos/rose-logo.png" />
    <script>
      // Apply the saved/system theme before Angular boots to avoid a flash (FOUC).
      (function () {
        try {
          var match = document.cookie.match(/(?:^|;\s*)rose\.theme=([^;]*)/);
          var saved = match ? decodeURIComponent(match[1]) : null;
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <style>
      .app-initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fafafa;
        z-index: 99999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.2s ease;
      }
      html.dark .app-initial-loader {
        background-color: #09090b;
        color: #f4f4f5;
      }
      .app-initial-loader__spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(138, 23, 48, 0.15);
        border-top-color: #8a1730;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      html.dark .app-initial-loader__spinner {
        border-color: rgba(255, 170, 185, 0.15);
        border-top-color: #ffaab9;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-initial-loader" aria-label="Loading application">
        <div class="app-initial-loader__spinner" role="status"></div>
      </div>
    </app-root>
  </body>
</html>
